@keyframes fx-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.fx-bob { animation: fx-bob 2.4s ease-in-out infinite; }
@keyframes fx-jump { 0% { transform: translateY(0) scale(1); } 20% { transform: translateY(4px) scale(1.08, .9); } 45% { transform: translateY(-30px) rotate(-8deg) scale(.95, 1.08); } 70% { transform: translateY(0) rotate(5deg) scale(1.06, .94); } 100% { transform: none; } }
.fx-jump { animation: fx-jump .75s ease-out; }
@keyframes fx-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.fx-shake { animation: fx-shake .45s; }
@keyframes fx-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.fx-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: fx-draw .7s ease-out forwards; }
@keyframes fx-fade { from { opacity: 0; } to { opacity: 1; } }
.fx-fade { opacity: 0; animation: fx-fade .4s forwards; }
@keyframes fx-rise { 0% { transform: translateY(0) scale(.5); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.15); } 100% { transform: translateY(-90px) scale(1); opacity: 0; } }
.fx-rise { animation: fx-rise 1.3s ease-out forwards; }
@keyframes fx-slide { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.fx-slide { animation: fx-slide .35s both; }
@keyframes fx-enter { 0% { transform: translateY(26px) scale(.97); opacity: 0; } 60% { transform: translateY(-3px) scale(1.005); opacity: 1; } 100% { transform: none; opacity: 1; } }
.fx-enter { animation: fx-enter .5s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes fx-spark { 0% { transform: translate(0, 0) scale(.2) rotate(0deg); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(200deg); opacity: 0; } }
.fx-spark { animation: fx-spark .9s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes fx-heart { 0% { transform: translate(-50%, 0) scale(.4); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -12px) scale(1.2); } 100% { transform: translate(-50%, -70px) scale(.9); opacity: 0; } }
.fx-heart { position: absolute; left: 50%; top: 8%; font-size: 26px; pointer-events: none; animation: fx-heart 1.1s ease-out forwards; }
@keyframes fx-walk { from { transform: translateX(-110px); } to { transform: translateX(var(--w)); } }
.fx-walker { position: absolute; bottom: 10px; left: 0; animation: fx-walk linear infinite; }
@keyframes fx-step { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
.fx-step { animation: fx-step .5s ease-in-out infinite; }
@keyframes fx-wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
.fx-card { animation: fx-pop .5s both; }
.fx-card:active { animation: fx-wiggle .3s; }
@keyframes fx-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.fx-cta { animation: fx-glow 1.6s ease-in-out infinite; }
.fx-cta:active { animation: none; }
.fx-play { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.fx-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fx-worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
@media (min-width: 960px) and (orientation: landscape) { .fx-play { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); } }
@media (min-width: 900px) { .fx-root { font-size: 18px; } }
@media (prefers-reduced-motion: reduce) { .fx-root * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; } }
