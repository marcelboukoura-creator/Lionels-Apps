<title>Lionels Lese-Abenteuer</title>

function shuf(rng, list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function take(rng, list, used, keyFn) {
  let pool = list.filter(item => !used.has(keyFn(item)));
  if (!pool.length) { used.clear(); pool = list.slice(); }
  const item = pool[Math.floor(rng() * pool.length)];
  used.add(keyFn(item));
  return item;
}

}

}
function renderAlbum() {
  let html = '<p class="hintline">Abzeichen bleiben hier, auch wenn du Münzen ausgibst.</p><div class="achgrid">';
  ACH.forEach(a => {
    const on = save.achievements.indexOf(a.id) >= 0;
    html += '<div class="card ach' + (on ? " on" : "") + '"><div style="font-size:40px">' + a.emoji + '</div><b>' + esc(a.name) + '</b><div class="hintline">' + esc(a.desc) + '</div></div>';
  });
  html += '</div>';
  const stickers = save.owned.map(shopById).filter(s => s && s.slot === "sticker");
  if (stickers.length) html += '<h2 class="cat">Sticker</h2><p style="font-size:40px">' + stickers.map(s => s.emoji).join(" ") + '</p>';
  return html;
}
function renderChest() {
  const unit = UNITS.find(u => u.id === ui.chestUnit);
  return '<div class="card" style="text-align:center">' + chestSvg() + '<h2>Welt-Truhe</h2><p class="prompt">' + esc(unit ? unit.name : "") + '</p><p>+15 Münzen</p><button type="button" class="primary" data-act="home">Weiter</button></div>';
}
function renderGate() {
  return '<div class="card" style="text-align:center" data-a="' + ui.gateA + '" data-b="' + ui.gateB + '"><p>Kleine Elternfrage, damit hier nicht aus Versehen etwas verstellt wird.</p><div class="prompt">' + ui.gateA + ' × ' + ui.gateB + ' = ?</div><div class="read">' + esc(ui.gate || ' ') + '</div>' + (ui.gateBad ? '<p class="hintline">Noch einmal versuchen.</p>' : '') + '<div class="pad">' + ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(k => '<button type="button" data-act="' + (k === 'OK' ? 'gate-ok' : k === '⌫' ? 'gate-del' : 'digit') + '"' + (k >= '0' && k <= '9' ? ' data-d="' + k + '"' : '') + '>' + k + '</button>').join('') + '</div></div>';
}
function renderParents() {
  const done = MAIN.filter(id => save.lessons[id] && save.lessons[id].done).length;
  const starSum = Object.keys(save.lessons).reduce((n, id) => n + (save.lessons[id].stars || 0), 0);
  const acc = save.stats.answered ? Math.round(save.stats.firstTry / save.stats.answered * 100) : 0;
  let units = UNITS.filter(u => !u.bonus).map(u => '<div class="card"><b>' + esc(u.name) + '</b><div>' + u.lessons.filter(id => save.lessons[id] && save.lessons[id].done).length + " / " + u.lessons.length + " Lektionen</div></div>").join("");
  return '<div class="card"><p>Alles bleibt nur auf diesem iPad im Browser. Kein Konto, kein Tracking, kein Kauf mit echtem Geld.</p><p><b>' + done + '</b> von ' + MAIN.length + ' Lektionen · <b>' + save.coins + '</b> Münzen · Serie <b>' + save.streak + '</b> · erster Versuch <b>' + acc + ' %</b> · Sterne <b>' + starSum + '</b> · Abzeichen <b>' + save.achievements.length + '</b></p>' + (storageOk ? '' : '<p>Der Browser-Speicher ist hier nicht verfügbar.</p>') + '</div>' + units +
    '<div class="card"><div class="kicker">Vorlesestimme</div><p class="hintline">Etwas langsamer ist fürs Lesenlernen angenehm. Am iPad klingen Premium- oder erweiterte deutsche Stimmen am besten, zum Beispiel Anna.</p><div class="row">' +
    [['0.8','Langsamer'],['0.9','Normal'],['1','Etwas schneller']].map(pair => '<button type="button" data-act="rate" data-rate="' + pair[0] + '"' + (String(save.settings.rate) === pair[0] ? ' class="primary"' : '') + '>' + pair[1] + '</button>').join("") +
    '<button type="button" data-act="hear">Stimme anhören</button></div></div>' +
    '<div class="card"><div class="kicker">Mikrofon</div><p class="hintline">Zuhören klappt am zuverlässigsten in einem normalen Safari-Tab. Als Home-Bildschirm-App ist die Erkennung manchmal stumm. Weiter ohne Mikrofon geht immer.</p><button type="button" data-act="mic-toggle" class="' + (save.settings.mic ? "primary" : "") + '">' + (save.settings.mic ? "Mikrofon ist an" : "Mikrofon ist aus") + '</button></div>' +
    '<div class="card">' + (ui.resetAsk ? '<p>Wirklich alle Münzen, Abzeichen und Lektionen auf diesem Gerät löschen?</p><div class="row"><button type="button" data-act="reset-yes">Ja, löschen</button><button type="button" data-act="reset-no">Abbrechen</button></div>' : '<button type="button" data-act="reset-ask">Fortschritt zurücksetzen</button>') + '</div>';
}
function celebrate() {
  if (!ui.celebrate) return "";
  const item = shopById(ui.celebrate);
  if (!item) return "";
  return '<button type="button" class="cele" data-act="celebrate-ok"><span class="card"><h2 style="font-size:40px;margin:0 0 8px">Gekauft!</h2><div class="preview" style="background:' + themeBg(item) + '">' + (item.slot === "hat" ? mascot("cheer", item.emoji, "", "lg") : item.slot === "pet" ? mascot("cheer", hatEmoji(), item.emoji, "lg") : '<div style="font-size:64px">' + item.emoji + '</div>') + '</div><p>' + esc(item.name) + ' gehört dir.</p><p class="hintline">Tippe, um weiterzumachen.</p></span></button>';
}
function render() {
  document.body.dataset.theme = save.equip.theme || "default";
  document.body.classList.toggle("show-banner", !!(session && session.phase === "feedback"));
  let screen = ui.name;
  if (ui.name === "lesson" && session && session.phase === "reward") screen = "reward";
  let inner = "";
  if (ui.name === "lesson" && session) inner = renderLesson();
  else if (ui.name === "shop") inner = renderShop();
  else if (ui.name === "album") inner = renderAlbum();
  else if (ui.name === "chest") inner = renderChest();
  else if (ui.name === "gate") inner = renderGate();
  else if (ui.name === "parents") inner = renderParents();
  else { inner = renderPath(); screen = "path"; }
  const root = document.getElementById("app");
  root.innerHTML = confetti() + bar() + inner + celebrate();
  root.dataset.screen = screen;
  root.dataset.hat = save.equip.hat || "";
  root.dataset.pet = save.equip.pet || "";
  root.dataset.ready = "1";
}
document.getElementById("app").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.hasAttribute("disabled")) return;
  unlockAudio();
  const act = b.getAttribute("data-act");
  if (act === "celebrate-ok") { ui.celebrate = ""; render(); return; }
  if (act === "say") { speak(b.getAttribute("data-say")); sfx("pop"); return; }
  if (act === "mic" || act === "mic-again") { if (session && session.listening) return; if (act === "mic-again" && session) { session.phase = "ask"; session.banner = ""; } startMic(); return; }
  if (act === "replay") { const ex = session && exNow(); if (ex) speak(ex.say || ex.text || ex.prompt || ""); return; }
  if (act === "shop") { stopRec(); ui.name = "shop"; ui.shopMsg = ""; ui.celebrate = ""; render(); return; }
  if (act === "album") { stopRec(); ui.name = "album"; session = null; render(); return; }
  if (act === "home" || act === "quit") { stopRec(); ui.name = "path"; ui.note = ""; session = null; render(); return; }
  if (act === "locked" || act === "chest-done") {
    const lesson = specOf(b.getAttribute("data-id") || "");
    ui.note = act === "chest-done" ? "Diese Truhe ist schon offen." : (lesson && unitOf(lesson.id).bonus ? "Diese Geschichte gibt es im Shop für Münzen." : "Erst die Lektion davor zu Ende üben.");
    sfx("soft"); render(); return;
  }
  if (act === "chest") {
    const unit = b.getAttribute("data-unit");
    if (save.chests[unit]) { ui.note = "Diese Truhe ist schon offen."; render(); return; }
    save.chests[unit] = true;
    addCoins(15);
    ui.chestUnit = unit;
    ui.name = "chest";
    ui.note = "";
    checkAchievements();
    persist();
    sfx("fan");
    render();
    speak("Die Truhe ist offen!");
    return;
  }
  if (act === "open") {
    try { beginLesson(b.getAttribute("data-id")); }
    catch (err) { ui.name = "path"; ui.note = "Diese Lektion mag gerade nicht. Versuch es noch einmal."; session = null; render(); }
    return;
  }
  if (act === "gate") { ui.name = "gate"; ui.gate = ""; ui.gateBad = false; ui.gateA = 6 + Math.floor(Math.random() * 4); ui.gateB = 6 + Math.floor(Math.random() * 4); render(); return; }
  if (act === "digit") { if (ui.gate.length < 2) ui.gate += b.getAttribute("data-d"); ui.gateBad = false; render(); return; }
  if (act === "gate-del") { ui.gate = ui.gate.slice(0, -1); render(); return; }
  if (act === "gate-ok") { if (Number(ui.gate) === ui.gateA * ui.gateB) { ui.name = "parents"; ui.resetAsk = false; } else { ui.gate = ""; ui.gateBad = true; } render(); return; }
  if (act === "rate") { save.settings.rate = Number(b.getAttribute("data-rate")); persist(); speak("Hallo " + CHILD + ", ich lese dir vor."); render(); return; }
  if (act === "hear") { speak("Hallo " + CHILD + ", ich lese dir vor."); return; }
  if (act === "mic-toggle") { save.settings.mic = !save.settings.mic; persist(); render(); return; }
  if (act === "reset-ask") { ui.resetAsk = true; render(); return; }
  if (act === "reset-no") { ui.resetAsk = false; render(); return; }
  if (act === "reset-yes") { save = defaultSave(); persist(); ui = { name:"path", note:"", shopMsg:"", celebrate:"", gate:"", gateBad:false, resetAsk:false }; session = null; render(); return; }
  if (act === "buy") {
    const item = shopById(b.getAttribute("data-id"));
    if (!item) return;
    const owned = save.owned.indexOf(item.id) >= 0;
    if (owned) {
      if (item.slot === "hat") save.equip.hat = item.id;
      else if (item.slot === "pet") save.equip.pet = item.id;
      else if (item.slot === "trail") save.equip.trail = item.id;
      else if (item.slot === "theme") save.equip.theme = THEME_OF[item.id];
      ui.shopMsg = item.name + " ist angezogen.";
      persist(); sfx("pop"); render(); return;
    }
    if (save.coins < item.price) { ui.shopMsg = "Noch " + (item.price - save.coins) + " Münzen. Du schaffst das."; sfx("soft"); render(); return; }
    save.coins -= item.price;
    save.owned.push(item.id);
    if (item.slot === "hat") save.equip.hat = item.id;
    else if (item.slot === "pet") save.equip.pet = item.id;
    else if (item.slot === "trail") save.equip.trail = item.id;
    else if (item.slot === "theme") save.equip.theme = THEME_OF[item.id];
    ui.shopMsg = item.name + " gehört dir!";
    ui.celebrate = item.id;
    checkAchievements();
    persist(); sfx("fan"); render(); return;
  }
  if (!session) return;
  if (act === "skip-mic") { skipMic(); return; }
  if (act === "next") { if (session.phase === "feedback") nextStep(); return; }
  if (session.phase !== "ask") return;
  if (act === "answer") { if (b.getAttribute("data-ok") === "1") resolve(session.wrongs === 0, "choice"); else { session.wrongs++; resolve(false, "choice"); } return; }
  if (act === "syll") {
    const ex = exNow();
    const i = Number(b.getAttribute("data-i"));
    const part = ex.pool[i];
    if (part !== ex.parts[session.built.length]) { softMiss(); return; }
    session.used[i] = true;
    session.built.push(part);
    if (session.built.length === ex.parts.length) resolve(session.wrongs === 0, "built");
    else { sfx("pop"); render(); }
    return;
  }
  if (act === "order") {
    const ex = exNow();
    const i = Number(b.getAttribute("data-i"));
    const word = ex.order[i];
    if (word !== ex.words[session.orderPick.length]) { softMiss(); return; }
    session.orderUsed[i] = true;
    session.orderPick.push(word);
    if (session.orderPick.length === ex.words.length) resolve(session.wrongs === 0, "built");
    else { sfx("pop"); render(); }
  }
});
window.addEventListener("resize", () => { if (ui && ui.name === "path") { const y = window.scrollY; render(); window.scrollTo(0, y); } });
try {
  selfCheck();
  save = load();
  ui = { name:"path", note:"", shopMsg:"", celebrate:"", gate:"", gateA:0, gateB:0, gateBad:false, resetAsk:false, chestUnit:"" };
  window.__lesenReady = true;
  render();
} catch (err) {
  document.getElementById("app").textContent = "Inhaltfehler: " + err.message;
}
</script>
</body>
</html>
