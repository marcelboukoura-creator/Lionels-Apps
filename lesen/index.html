<style>
  :root {
    --bg:#FFFDF7; --card:#FFFFFF; --ink:#3A2418; --muted:#7A6558;
    --accent:#F07F2A; --accent-2:#1F8A4C; --soft:#FFE8D2; --line:#E7D7C6;
    --good:#146B38; --goodbg:#E5F6EA; --bad:#9C3B32; --badbg:#FDECEA;
    --gold:#E2B203;
  }
  body[data-theme="sun"] {
    --bg:#FFF3E4; --card:#FFFBF5; --accent:#E25B2A; --soft:#FFD8BF; --line:#F0C8AE;
  }
  body[data-theme="night"] {
    --bg:#1B2433; --card:#273246; --ink:#F6F1E8; --muted:#D5CBBE;
    --accent:#F0B429; --soft:#3A3120; --line:#3C4C66; --goodbg:#1E3A2C; --badbg:#3A2424;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body {
    font-family:-apple-system, "SF Pro Rounded", system-ui, sans-serif;
    min-height:100vh; min-height:100svh;
    touch-action:manipulation;
  }
  button, a { font:inherit; color:inherit; touch-action:manipulation; }
  button {
    border:0; background:var(--card); cursor:pointer;
    border-radius:18px; min-height:64px; padding:12px 16px;
    font-weight:800; font-size:22px; line-height:1.2;
    box-shadow:0 4px 0 var(--line);
  }
  button:active, a.appish:active { filter:brightness(.94); }
  button:disabled { opacity:.45; }
  button:focus-visible, a:focus-visible { outline:4px solid var(--ink); outline-offset:3px; }
  .wrap {
    max-width:1100px; margin:0 auto;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(22px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }
  header.bar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header.bar h1 { font-size:clamp(26px, 4vw, 40px); margin:0; flex:1; line-height:1.1; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--card); border-radius:999px; padding:8px 14px; font-weight:800; box-shadow:0 3px 0 var(--line); min-height:52px; }
  .foxbox { position:relative; width:92px; height:92px; flex:0 0 auto; }
  .foxbox svg { width:92px; height:92px; display:block; }
  .hat { position:absolute; left:18px; top:-6px; font-size:34px; pointer-events:none; }
  .pet { position:absolute; right:-8px; bottom:-4px; font-size:32px; pointer-events:none; animation:bob 2.4s ease-in-out infinite; }
  .cheer { animation:hop .7s ease; }
  @keyframes bob { 50% { transform:translateY(-5px); } }
  @keyframes hop { 40% { transform:translateY(-10px); } 100% { transform:none; } }
  @keyframes pop { 0% { transform:scale(.7); opacity:0; } 100% { transform:none; opacity:1; } }
  .card { background:var(--card); border-radius:24px; padding:16px; box-shadow:0 4px 0 var(--line); margin-bottom:14px; }
  .unit-title { display:flex; gap:10px; align-items:center; font-size:26px; font-weight:900; margin:18px 0 8px; }
  .nodes { display:grid; grid-template-columns:1fr; gap:12px; }
  .node { display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--soft); }
  .node.now { box-shadow:0 0 0 4px var(--accent), 0 4px 0 var(--line); }
  .node small { display:block; font-weight:700; color:var(--muted); font-size:16px; }
  .lock { opacity:.72; }
  .primary { background:var(--accent); color:#3A2418; }
  .green { background:var(--accent-2); color:#fff; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .choices { display:grid; grid-template-columns:1fr; gap:10px; }
  .choice { min-height:76px; font-size:26px; text-align:left; display:flex; align-items:center; gap:12px; }
  .hot { color:var(--accent); }
  .words { font-size:clamp(28px, 4vw, 40px); font-weight:900; line-height:1.35; }
  .words button.word, button.word {
    display:inline-flex; min-height:52px; font-size:inherit; font-weight:900;
    background:transparent; box-shadow:none; padding:2px 4px; border-radius:10px;
    text-decoration:underline; text-decoration-thickness:3px; text-decoration-color:var(--line);
  }
  .syll { color:inherit; }
  .s0 { color:#F07F2A; } .s1 { color:#1F8A4C; } .s2 { color:#2F6FED; } .s3 { color:#C43B7A; }
  .tray { min-height:72px; border:3px dashed var(--line); border-radius:18px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  .chip { background:var(--soft); }
  .w.richtig { color:var(--good); } .w.fast { color:#B26A00; } .w.fehlt { color:var(--bad); }
  .feedback { background:var(--goodbg); color:var(--good); border-radius:20px; padding:14px 16px; font-size:24px; font-weight:800; }
  .feedback.kind { background:var(--soft); color:var(--ink); }
  .hintline { color:var(--muted); font-weight:700; font-size:18px; }
  .teach { font-size:20px; font-weight:800; }
  .stars { color:var(--gold); letter-spacing:2px; font-size:28px; }
  .shop { display:grid; grid-template-columns:1fr; gap:12px; }
  .item { text-align:left; }
  .item .price { display:block; font-size:18px; color:var(--muted); }
  .pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-width:420px; margin:0 auto; }
  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:4; }
  .confetti i { position:absolute; top:-20px; font-style:normal; font-size:26px; animation:fall 1.2s ease-in forwards; }
  @keyframes fall { to { transform:translateY(85vh) rotate(160deg); opacity:.2; } }
  .story { font-size:clamp(22px, 3vw, 28px); font-weight:800; line-height:1.4; }
  .banner { font-size:18px; font-weight:800; color:var(--muted); }
  @media (min-width:720px) {
    .choices { grid-template-columns:1fr 1fr; }
    .shop { grid-template-columns:1fr 1fr; }
    .nodes { grid-template-columns:1fr 1fr; }
  }
  @media (orientation:landscape) and (min-width:900px) {
    .lesson-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:16px; align-items:start; }
    .choices { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) {
    * { animation:none !important; }
  }
</style>
</head>

  if (/google/.test(t) && /deutsch|german/.test(t + (v.lang || ""))) n += 35;
  if (/anna|seraphina|petra|helena|katja|vicki|marlene|helena|steffan|conrad/.test(t)) n += 20;
  if (/grandpa|grandma|eddy|reed|rocko|flo|bubbles|jester|organ|superstar|trinoids|whisper|wobble|zarvox|cellos|albert|fred|junior|ralph|bahh|bells|boing|bad|good/.test(t)) n -= 50;

function normWord(w) {
  return String(w).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");
}
function lev(a, b) {
  const m = a.length, n = b.length;
  const d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));

  }
  return d[m][n];
}
function sim(a, b) {
  if (!a && !b) return 1;
  if (!a || !b) return 0;
  return 1 - lev(a, b) / Math.max(a.length, b.length);
}
function gradeWords(target, heard) {
  const t = String(target).split(/\s+/).map(normWord).filter(Boolean);
  const h = String(heard).split(/\s+/).map(normWord).filter(Boolean);
  let j = 0;
  return t.map(word => {
    let best = 0, at = j;
    for (let k = j; k < Math.min(h.length, j + 4); k++) {
      const s = sim(word, h[k]);
      if (s > best) { best = s; at = k; }
    }
    if (best >= 0.55) j = at + 1;
    return best >= 0.9 ? "richtig" : best >= 0.55 ? "fast" : "fehlt";

}
function heardPasses(target, heard, grades) {
  if (!heard || !String(heard).trim()) return false;
  const good = grades.filter(g => g === "richtig" || g === "fast").length;
  const need = Math.max(1, Math.ceil(grades.length * 0.6));
  const whole = sim(normWord(String(target).replace(/\s+/g," ")), normWord(String(heard).replace(/\s+/g," ")));

}
function stopRec() {

function micNote(code) {
  if (code === "not-allowed") return "Das Mikrofon ist nicht erlaubt. Du kannst ohne Mikrofon weiter.";
  if (code === "service-not-allowed") return "Auf dem iPad muss die Diktierfunktion an sein. Du kannst auch ohne Mikrofon weiter.";
  if (code === "no-speech") return "Ich habe noch nichts gehört. Nochmal oder ohne Mikrofon weiter.";
  if (code === "audio-capture") return "Das Mikrofon ist gerade belegt. Du kannst ohne Mikrofon weiter.";

}
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!save.settings.mic || !SR) {
    session.speakMsg = "Hier kann nicht zugehört werden. Lies leise mit und tippe weiter.";
    render();
    return;
  }
  stopRec();
  session.listening = true;
  session.speakMsg = "Ich höre zu …";
  session.heard = "";
  session.grades = [];
  render();
  // iPad Safari: Spracherkennung in derselben Tippgeste starten, nicht nach await.
  // Kein offener getUserMedia-Stream daneben, der auf dem iPad das Mikrofon stumm schaltet.
  const target = exNow().text;
  rec = new SR();
  rec.lang = "de-DE";
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 3;
  rec.onresult = (ev) => {
    if (!session || session.phase !== "ask" || exNow().t !== "speak") return;
    let transcript = "", final = false, best = -1;
    for (let i = 0; i < ev.results.length; i++) {
      let localBest = "", localScore = -1;
      const alts = ev.results[i];
      for (let a = 0; a < alts.length; a++) {
        const text = alts[a].transcript || "";
        const score = sim(normWord(target), normWord(text));
        if (score > localScore) { localScore = score; localBest = text; }
      }
      transcript += localBest + " ";
      if (alts.isFinal) final = true;
      if (localScore > best) best = localScore;
    }
    transcript = transcript.trim();
    session.heard = transcript;
    session.grades = gradeWords(target, transcript);

    session.speakMsg = "Das Mikrofon startet nicht. Du kannst ohne Mikrofon weiter.";
    render();
  }

function grant(n) {

}

    save.stats.lessons++;

    if (save.lastDay !== t) {
      save.streak = save.lastDay && dayBefore(t) === save.lastDay ? save.streak + 1 : 1;
      save.lastDay = t;
    }
    if (save.goalDoneOn !== t) { save.goalDoneOn = t; session.goal = true; }
  }
  save.lessons[id] = { done:true, stars: Math.max(stars, prev && prev.stars || 0) };
  session.stars = save.lessons[id].stars;
  session.unitClear = false;
  if (firstClear) {
    const unit = unitOf(id);
    if (unit && !unit.bonus && unit.lessons.every(lid => save.lessons[lid] && save.lessons[lid].done)) {

    body += '<div class="card"><div class="banner">Tippe die Wörter in die richtige Reihe.</div><div class="tray words">' + (session.orderPick.length ? session.orderPick.map(w => esc(w)).join(" ") : "…") + '</div></div>';
    const need = ex.words[session.orderPick.length];
    body += '<div class="choices">' + session.order.map((w, i) => session.orderUsed[i] ? "" : '<button type="button" class="choice" data-act="order" data-i="' + i + '" ' + (w === need ? 'data-ok="1"' : '') + '>' + esc(w) + '</button>').join("") + '</div>';
  } else if (ex.t === "quiz") {
    body += '<div class="card story">' + wordButtons(ex.text) + '</div><div class="card"><div class="banner">' + esc(ex.q) + '</div></div>';
    body += optionButtons(ex.options, sound);
  } else if (ex.t === "speak") {
    const grades = session.grades || [];
    const parts = ex.text.split(/\s+/);
    const colored = parts.map((w, i) => '<span class="w ' + esc(grades[i] || "") + '">' + esc(w) + '</span>').join(" ");
    const sr = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micOk = save.settings.mic && !!sr;
    body += '<div class="card"><div class="banner">Lies den Satz laut vor.</div><div class="words">' + (grades.length ? colored : wordButtons(ex.text)) + '</div>' +
      (session.heard ? '<p class="hintline">Gehört: ' + esc(session.heard) + '</p>' : '') +
      (session.speakMsg ? '<p class="hintline">' + esc(session.speakMsg) + '</p>' : '') +
      '</div><div class="row"><button type="button" data-act="replay">🔊 Vorlesen</button>' +
      (micOk ? '<button type="button" class="primary" data-act="mic"' + (session.listening ? " disabled" : "") + '>' + (session.listening ? "Ich höre zu …" : "🎤 Ich lese vor") + '</button>' : '') +
      '<button type="button" class="green" data-act="skip-mic">Weiter ohne Mikrofon</button></div>';
    if (!micOk) body += '<p class="hintline">Ohne Mikrofon liest du leise mit. Das ist auch Üben.</p>';
  }
  if (session.note && session.phase === "ask") body += '<div class="feedback kind">' + esc(session.note) + '</div>';
  return body;
}
function renderLesson() {
  const lesson = lessonById(session.lessonId);
  const ex = exNow();
  if (session.phase === "reward") {
    return '<div data-screen="reward"><div class="card" style="text-align:center">' + mascot("cheer") +
      '<div aria-hidden="true"><svg viewBox="0 0 88 64" width="88" height="64"><rect x="8" y="24" width="72" height="34" rx="6" fill="#C95F14"/><path d="M10 28 Q44 4 78 28" fill="#F07F2A"/><rect x="38" y="30" width="12" height="10" rx="2" fill="#FFE08A"/><rect x="8" y="36" width="72" height="6" fill="#E2B203"/></svg></div><h2 style="margin:8px 0">Truhe geöffnet!</h2>' +
      '<div class="stars" aria-label="' + session.stars + ' Sterne">' + starsText(session.stars) + '</div>' +
      '<p style="font-size:24px;font-weight:900">+' + session.coins + ' Münzen</p>' +
      (session.goal ? '<p class="feedback">Tagesziel geschafft!</p>' : '') +
      (session.unitClear ? '<p class="feedback">' + esc(session.unitClear) + ' geschafft!</p>' : '') +
      (session.firstClear ? '' : '<p class="hintline">Diese Lektion kennst du schon. Die Sterne bleiben erhalten.</p>') +
      '<button type="button" class="primary" data-act="home">Zur Strecke</button></div></div>';
  }
  const dots = lesson.exercises.map((_, i) => '<span style="flex:1;height:10px;border-radius:8px;background:' + (i < session.step ? 'var(--accent-2)' : i === session.step ? 'var(--accent)' : 'var(--line)') + '"></span>').join("");
  let main = '<div class="banner">' + esc(lesson.title) + ' · etwa ' + lesson.minutes + ' Minuten' + (session.combo >= 2 ? ' · Combo ' + session.combo : '') + '</div><div style="display:flex;gap:6px;margin:8px 0 12px">' + dots + '</div>';
  if (session.phase === "feedback") {
    main += '<div class="lesson-grid"><div class="card" style="text-align:center">' + mascot("wow") + '<div class="feedback">' + esc(session.feedback) + '</div></div><button type="button" class="primary" data-act="next">Weiter</button></div>';
  } else main += '<div class="lesson-grid">' + exerciseBody(lesson, ex) + '</div>';
  return '<div data-screen="lesson">' + main + '</div>';
}
function renderPath() {
  const goal = save.goalDoneOn === today();
  let html = '<div data-screen="path"><div class="card" style="display:flex;gap:12px;align-items:center">' + mascot("happy") +
    '<div><div style="font-size:28px;font-weight:900">Hallo ' + CHILD + '!</div><div class="hintline">' + (goal ? "Tagesziel geschafft. Magst du noch eine Lektion?" : "Tipp die leuchtende Lektion an. Eine am Tag reicht schon.") + '</div></div></div>';
  const stickers = save.owned.map(shopById).filter(s => s && s.slot === "sticker");
  if (stickers.length) html += '<div class="banner">Deine Sticker: ' + stickers.map(s => s.emoji).join(" ") + '</div>';
  UNITS.forEach(unit => {
    html += '<div class="unit-title"><span aria-hidden="true">' + unit.emoji + '</span><span>' + esc(unit.name) + '<small style="display:block;font-size:16px;color:var(--muted)">' + esc(unit.blurb) + '</small></span></div><div class="nodes">';
    unit.lessons.forEach(id => {
      const lesson = lessonById(id);
      const done = save.lessons[id] && save.lessons[id].done;
      const playable = isPlayable(lesson);
      const open = playable;
      const stars = done ? save.lessons[id].stars : 0;
      const price = lesson.bonus ? (shopById(lesson.shopId) || {}).price : 0;
      html += '<button type="button" class="node' + (open && !done ? " now" : "") + (open ? "" : " lock") + '" data-act="' + (open ? "open" : "locked") + '" data-id="' + lesson.id + '" data-done="' + (done ? "1" : "0") + '" data-stars="' + stars + '"><span style="font-size:34px" aria-hidden="true">' + (open ? unit.emoji : "🔒") + '</span><span><b>' + esc(lesson.title) + '</b><small>' + (done ? starsText(stars) : open ? "etwa " + lesson.minutes + " Minuten" : lesson.bonus ? price + " Münzen im Shop" : "noch gesperrt") + '</small></span></button>';
    });
    html += '</div>';
  });
  html += '<div class="row" style="margin-top:16px"><button type="button" data-act="shop">Shop</button><button type="button" data-act="gate">Für Eltern</button></div>';
  if (ui.note) html += '<p class="feedback kind">' + esc(ui.note) + '</p>';
  return html + '</div>';
}
function renderShop() {
  let html = '<div data-screen="shop"><p class="hintline">Münzen gibt es fürs Üben. Nichts kostet echtes Geld.</p>';
  if (ui.shopMsg) html += '<div class="feedback" data-msg>' + esc(ui.shopMsg) + '</div>';
  html += '<div class="shop">';
  SHOP.forEach(item => {
    const owned = save.owned.includes(item.id);
    const equipped = item.slot === "hat" ? save.equip.hat === item.id : item.slot === "pet" ? save.equip.pet === item.id : item.slot === "trail" ? save.equip.trail === item.id : item.slot === "theme" ? (item.id === "theme-sun" ? save.equip.theme === "sun" : save.equip.theme === "night") : false;
    const label = owned ? (item.slot === "bonus" ? "Auf der Strecke" : equipped ? "Dabei" : "Anlegen") : "Kaufen · " + item.price;
    html += '<button type="button" class="item" data-act="buy" data-id="' + item.id + '"><span style="font-size:32px" aria-hidden="true">' + item.emoji + '</span> ' + esc(item.name) + '<span class="price">' + esc(item.desc) + ' · ' + label + '</span></button>';
  });
  return html + '</div></div>';
}
function renderGate() {
  return '<div data-screen="gate" class="card" style="text-align:center" data-a="' + ui.gateA + '" data-b="' + ui.gateB + '"><p>Kleine Elternfrage, damit hier nicht aus Versehen etwas verstellt wird.</p><div style="font-size:40px;font-weight:900">' + ui.gateA + ' × ' + ui.gateB + ' = ?</div><div class="words" style="min-height:64px">' + esc(ui.gate || " ") + '</div>' +
    (ui.gateBad ? '<p class="feedback kind">Noch einmal versuchen.</p>' : '') +
    '<div class="pad">' + ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].map(k => '<button type="button" data-act="' + (k === "OK" ? "gate-ok" : k === "⌫" ? "gate-del" : "digit") + '" ' + (k >= "0" && k <= "9" ? 'data-d="' + k + '"' : '') + '>' + k + '</button>').join("") + '</div></div>';
}
function renderParents() {
  const done = MAIN.filter(id => save.lessons[id] && save.lessons[id].done).length;
  const starSum = Object.keys(save.lessons).reduce((n, id) => n + (save.lessons[id].stars || 0), 0);
  const acc = save.stats.answered ? Math.round(save.stats.firstTry / save.stats.answered * 100) : 0;
  let units = UNITS.filter(u => !u.bonus).map(u => {
    const stars = u.lessons.reduce((n, id) => n + ((save.lessons[id] && save.lessons[id].stars) || 0), 0);
    return '<div class="card"><b>' + esc(u.name) + '</b><div class="stars">' + stars + ' Sterne</div></div>';
  }).join("");
  return '<div data-screen="parents"><div class="card"><p>Alles bleibt nur auf diesem iPad im Browser. Kein Konto, kein Tracking, kein Kauf mit echtem Geld.</p><p><b>' + done + '</b> von ' + MAIN.length + ' Lektionen · <b>' + save.coins + '</b> Münzen · Serie <b>' + save.streak + '</b> · beim ersten Versuch richtig: <b>' + acc + ' %</b> · Sterne gesamt <b>' + starSum + '</b></p></div>' +
    units +
    '<div class="card"><div class="banner">Vorlesestimme</div><p class="hintline">Etwas langsamer ist fürs Lesenlernen angenehm. Am iPad klingen Premium- oder erweiterte deutsche Stimmen am besten, zum Beispiel Anna.</p><div class="row">' +
    [['0.8','Langsamer'],['0.9','Normal'],['1','Etwas schneller']].map(pair => '<button type="button" data-act="rate" data-rate="' + pair[0] + '"' + (String(save.settings.rate) === pair[0] ? ' class="primary"' : '') + '>' + pair[1] + '</button>').join("") +
    '<button type="button" data-act="hear">Stimme anhören</button></div></div>' +
    '<div class="card"><div class="banner">Mikrofon beim Vorlesen</div><p class="hintline">Auf dem iPad klappt das Zuhören am zuverlässigsten in einem normalen Safari-Tab. Als Home-Bildschirm-App ist die Erkennung manchmal stumm. Lionel kann immer ohne Mikrofon weiter.</p><button type="button" data-act="mic-toggle" class="' + (save.settings.mic ? "primary" : "") + '">' + (save.settings.mic ? "Mikrofon ist an" : "Mikrofon ist aus") + '</button></div>' +
    '<div class="card">' + (ui.resetAsk ? '<p>Wirklich alle Münzen, Sticker und Lektionen auf diesem Gerät löschen?</p><div class="row"><button type="button" data-act="reset-yes">Ja, löschen</button><button type="button" data-act="reset-no">Abbrechen</button></div>' : '<button type="button" data-act="reset-ask">Fortschritt zurücksetzen</button>') + '</div></div>';
}
function render() {
  document.body.dataset.theme = save.equip.theme || "default";
  const screen = ui.name === "lesson" && session && session.phase === "reward" ? "reward" : ui.name === "lesson" ? "lesson" : ui.name;
  let inner = "";
  if (ui.name === "lesson" && session) inner = renderLesson();
  else if (ui.name === "shop") inner = renderShop();
  else if (ui.name === "gate") inner = renderGate();
  else if (ui.name === "parents") inner = renderParents();
  else inner = renderPath();
  document.getElementById("app").innerHTML = confetti() + bar() + inner;
  const root = document.getElementById("app");
  root.dataset.screen = screen;
}
document.getElementById("app").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.hasAttribute("disabled")) return;
  unlockAudio();
  const act = b.getAttribute("data-act");
  if (act === "say") { speak(b.getAttribute("data-say")); sfx("pop"); return; }
  if (act === "mic") { startMic(); return; }
  if (act === "replay") {
    const ex = session && exNow();
    if (!ex) return;
    speak(ex.say || ex.text || ex.prompt || "");
    return;
  }
  if (act === "shop") { stopRec(); ui.name = "shop"; ui.shopMsg = ""; render(); return; }
  if (act === "home" || act === "quit") { stopRec(); ui.name = "path"; ui.note = ""; session = null; render(); return; }
  if (act === "locked") {
    const lesson = lessonById(b.getAttribute("data-id"));
    ui.note = lesson && lesson.bonus ? "Diese Geschichte gibt es im Shop für Münzen." : "Erst die Lektion davor zu Ende üben.";
    sfx("soft"); render(); return;
  }
  if (act === "open") { ui.note = ""; beginLesson(b.getAttribute("data-id")); return; }
  if (act === "gate") {
    ui.name = "gate"; ui.gate = ""; ui.gateBad = false;
    ui.gateA = 6 + Math.floor(Math.random() * 4);
    ui.gateB = 6 + Math.floor(Math.random() * 4);
    render(); return;
  }
  if (act === "digit") { if (ui.gate.length < 2) ui.gate += b.getAttribute("data-d"); ui.gateBad = false; render(); return; }
  if (act === "gate-del") { ui.gate = ui.gate.slice(0, -1); render(); return; }
  if (act === "gate-ok") {
    if (Number(ui.gate) === ui.gateA * ui.gateB) { ui.name = "parents"; ui.resetAsk = false; }
    else { ui.gate = ""; ui.gateBad = true; }
    render(); return;
  }
  if (act === "rate") { save.settings.rate = Number(b.getAttribute("data-rate")); persist(); speak("Hallo " + CHILD + ", ich lese dir vor."); render(); return; }
  if (act === "hear") { speak("Hallo " + CHILD + ", ich lese dir vor."); return; }
  if (act === "mic-toggle") { save.settings.mic = !save.settings.mic; persist(); render(); return; }
  if (act === "reset-ask") { ui.resetAsk = true; render(); return; }
  if (act === "reset-no") { ui.resetAsk = false; render(); return; }
  if (act === "reset-yes") { save = defaultSave(); persist(); ui = freshUi(); session = null; render(); return; }
  if (act === "buy") {
    const item = shopById(b.getAttribute("data-id"));
    if (!item) return;
    if (save.owned.includes(item.id)) {
      if (item.slot === "hat") save.equip.hat = item.id;
      else if (item.slot === "pet") save.equip.pet = item.id;
      else if (item.slot === "trail") save.equip.trail = item.id;
      else if (item.slot === "theme") save.equip.theme = item.id === "theme-night" ? "night" : "sun";
      ui.shopMsg = item.slot === "bonus" ? "Die Geschichte wartet auf der Strecke." : item.name + " ist dabei.";
      persist(); sfx("pop"); render(); return;
    }
    if (save.coins < item.price) { ui.shopMsg = "Noch " + (item.price - save.coins) + " Münzen sammeln. Du schaffst das."; sfx("soft"); render(); return; }
    save.coins -= item.price;
    save.owned.push(item.id);
    if (item.slot === "hat") save.equip.hat = item.id;
    else if (item.slot === "pet") save.equip.pet = item.id;
    else if (item.slot === "trail") save.equip.trail = item.id;
    else if (item.slot === "theme") save.equip.theme = item.id === "theme-night" ? "night" : "sun";
    ui.shopMsg = item.name + " gehört dir!";
    persist(); sfx("coin"); render(); return;
  }
  if (!session) return;
  if (act === "skip-mic") { if (session.phase === "ask") skipMic(); return; }
  if (act === "next") { if (session.phase === "feedback") nextStep(); return; }
  if (session.phase !== "ask") return;
  if (act === "answer") {
    if (b.getAttribute("data-ok") === "1") { session.feedback = pick(PRAISE); succeed(); }
    else softMiss();
    return;
  }
  if (act === "syll") {
    const i = Number(b.getAttribute("data-i"));
    const part = session.pool[i];
    const need = exNow().parts[session.built.length];
    if (part !== need) { softMiss(); return; }
    session.used[i] = true;
    session.built.push(part);
    if (session.built.length === exNow().parts.length) { session.feedback = pick(PRAISE); succeed(); }
    else { sfx("pop"); render(); }
    return;
  }
  if (act === "order") {
    const i = Number(b.getAttribute("data-i"));
    const word = session.order[i];
    const need = exNow().words[session.orderPick.length];
    if (word !== need) { softMiss(); return; }
    session.orderUsed[i] = true;
    session.orderPick.push(word);
    if (session.orderPick.length === exNow().words.length) { session.feedback = pick(PRAISE); succeed(); }
    else { sfx("pop"); render(); }
  }
});
render();
</script>
</body>
</html>
