<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lionels Apps">
<title>Lionels Apps</title>
<style>
  :root { --bg:#FFFDF7; --ink:#3A2418; --muted:#7a6558; --mathe:#F07F2A; --lese:#7DDB9A; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0;
    font-family:-apple-system, "SF Pro Rounded", system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  main {
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:28px;
    max-width:1100px;
    margin:0 auto;
    padding:
      calc(28px + env(safe-area-inset-top))
      calc(24px + env(safe-area-inset-right))
      calc(28px + env(safe-area-inset-bottom))
      calc(24px + env(safe-area-inset-left));
  }
  h1 { margin:0; font-size:clamp(40px, 7vw, 68px); line-height:1.05; }
  p.sub { margin:10px 0 0; font-size:clamp(22px, 3vw, 30px); color:var(--muted); }
  nav { display:grid; grid-template-columns:1fr; gap:18px; }
  a.app {
    display:flex;
    align-items:center;
    gap:18px;
    min-height:132px;
    padding:22px 26px;
    border-radius:28px;
    text-decoration:none;
    color:var(--ink);
    font-weight:800;
    font-size:clamp(30px, 4.2vw, 44px);
    line-height:1.15;
    box-shadow:0 8px 0 rgba(58,36,24,.18);
    touch-action:manipulation;
  }
  a.app:active { transform:translateY(4px); box-shadow:0 4px 0 rgba(58,36,24,.18); }
  a.app:focus-visible { outline:4px solid var(--ink); outline-offset:4px; }
  .mathe { background:var(--mathe); }
  .lese { background:var(--lese); }
  .emoji { font-size:68px; line-height:1; flex:0 0 auto; }
  @media (orientation:landscape) and (min-width:900px) {
    main { gap:22px; }
    nav { grid-template-columns:1fr 1fr; }
    a.app {
      min-height:240px;
      flex-direction:column;
      justify-content:center;
      text-align:center;
      gap:14px;
      padding:28px;
    }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Hallo Lionel!</h1>
    <p class="sub">Tippe auf ein Spiel.</p>
  </header>
  <nav aria-label="Apps">
    <a class="app mathe" href="mathe/"><span class="emoji" aria-hidden="true">🦕</span><span>Mathe-Abenteuer</span></a>
    <a class="app lese" href="lesetest/"><span class="emoji" aria-hidden="true">🎤</span><span>Lese-Test / Mikrofon</span></a>
  </nav>
</main>
</body>
</html>
